// ============ Time helpers ============
function detectTZ() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }
  catch { return "UTC"; }
}
function tzLabel(tz) {
  try {
    const off = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" })
      .formatToParts(new Date()).find((p) => p.type === "timeZoneName")?.value;
    return `${tz.replace(/_/g, " ")} (${off || ""})`;
  } catch { return tz; }
}
function tzShort(tz) {
  try {
    const off = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" })
      .formatToParts(new Date()).find((p) => p.type === "timeZoneName")?.value;
    return `${tz.split("/").pop().replace(/_/g, " ")} (${off})`;
  } catch { return tz; }
}
function getOffsetMinutes(date, tz) {
  const dtf = new Intl.DateTimeFormat("en-US", {
    timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const parts = dtf.formatToParts(date).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  const asUTC = Date.UTC(
    parseInt(parts.year), parseInt(parts.month) - 1, parseInt(parts.day),
    parseInt(parts.hour), parseInt(parts.minute), parseInt(parts.second)
  );
  return (asUTC - date.getTime()) / 60000;
}
function slotToDate(dateStr, slotIdx, baseTz, startMinutes) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const totalMinutes = startMinutes + slotIdx * SLOT_MIN;
  const hh = Math.floor(totalMinutes / 60);
  const mm = totalMinutes % 60;
  let guess = new Date(Date.UTC(y, m - 1, d, hh, mm));
  for (let i = 0; i < 2; i++) {
    const off = getOffsetMinutes(guess, baseTz);
    guess = new Date(Date.UTC(y, m - 1, d, hh, mm) - off * 60000);
  }
  return guess;
}
function colHeaderLabel(date, tz, locale) {
  return new Intl.DateTimeFormat(locale, { timeZone: tz, weekday: "short", month: "short", day: "numeric" }).format(date);
}
function timeLabel(date, tz, locale, hour12) {
  return new Intl.DateTimeFormat(locale, { timeZone: tz, hour: "numeric", minute: "2-digit", hour12 }).format(date);
}
function fullLabel(date, tz, locale, hour12) {
  return new Intl.DateTimeFormat(locale, { timeZone: tz, weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", hour12 }).format(date);
}
function minutesLabel(min, lang) {
  const hh = Math.floor(min / 60), mm = min % 60;
  if (lang === "fr") return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  const hh12 = ((hh + 11) % 12) + 1;
  const ap = hh < 12 ? "AM" : "PM";
  return `${hh12}:${String(mm).padStart(2, "0")} ${ap}`;
}
function timeOptions(lang) {
  const opts = [];
  for (let m = 0; m <= 23 * 60 + 30; m += 30) opts.push({ value: m, label: minutesLabel(m, lang) });
  return opts;
}
function slotKey(dateIdx, slotIdx) { return `${dateIdx}-${slotIdx}`; }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dateRangeSummary(dates, tz, locale) {
  if (!dates || dates.length === 0) return "";
  const sorted = [...dates].sort();
  const fmt = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Intl.DateTimeFormat(locale, { month: "short", day: "numeric" }).format(new Date(Date.UTC(y, m - 1, d, 12)));
  };
  if (sorted.length === 1) return fmt(sorted[0]);
  return `${fmt(sorted[0])} – ${fmt(sorted[sorted.length - 1])} (${sorted.length})`;
}
function slugify(title) {
  return (title || "")
    .toLowerCase()
    .normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 40) || "poll";
}
function generateSurveyId(title) {
  return `${slugify(title)}-${Math.random().toString(36).slice(2, 6)}`;
}
function getSharedPollIdFromHash() {
  const raw = window.location.hash || "";
  const m = raw.match(/poll=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
// Best-effort: builds a link that jumps straight to a poll. Only reliable
// when this file is hosted at its own real URL — inside a sandboxed embed
// (e.g. Google Sites "Embed code"), the frame usually can't see the outer
// page's address, so this falls back to null and callers should offer a
// plain-text fallback instead of a broken link.
function buildShareLink(surveyId) {
  let topUrl = null;
  try {
    topUrl = window.top.location.href;
  } catch (e) {
    topUrl = null;
  }
  if (!topUrl) return null;
  const withoutHash = topUrl.split("#")[0];
  return `${withoutHash}#poll=${encodeURIComponent(surveyId)}`;
}

// ============ Backend (Google Apps Script + Sheet) ============
const SCRIPT_NOT_CONFIGURED = !APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0;

async function apiListSurveys() {
  const res = await fetch(`${APPS_SCRIPT_URL}?action=listSurveys`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.surveys || [];
}
async function apiGetConfig(surveyId) {
  const res = await fetch(`${APPS_SCRIPT_URL}?action=getConfig&survey=${encodeURIComponent(surveyId)}`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.config || null;
}
async function apiListResponses(surveyId) {
  const res = await fetch(`${APPS_SCRIPT_URL}?action=listResponses&survey=${encodeURIComponent(surveyId)}`);
  if (!res.ok) throw new Error("network");
  const data = await res.json();
  return data.responses || [];
}
// Apps Script Web Apps redirect POST requests in a way that can drop the
// request body in some browsers, so writes go out as opaque no-cors
// requests and are verified afterward with a normal (readable) GET.
async function apiPostRaw(action, payload) {
  await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, payload }),
  });
}
async function apiSaveConfig(surveyId, config) {
  await apiPostRaw("saveConfig", { ...config, surveyId });
  const confirmed = await apiGetConfig(surveyId);
  const ok = confirmed && confirmed.updatedAt === config.updatedAt;
  return { ok: !!ok, config: confirmed };
}
async function apiSaveResponse(surveyId, record) {
  await apiPostRaw("saveResponse", { ...record, surveyId });
  const responses = await apiListResponses(surveyId);
  const ok = responses.some((r) => r.id === record.id);
  return { ok, responses };
}
async function apiClearResponses(surveyId, passphrase) {
  await apiPostRaw("clearResponses", { surveyId, passphrase });
  const responses = await apiListResponses(surveyId);
  return { ok: responses.length === 0, responses };
}
async function apiDeleteSurvey(surveyId, passphrase) {
  await apiPostRaw("deleteSurvey", { surveyId, passphrase });
  const confirmed = await apiGetConfig(surveyId);
  return { ok: confirmed === null };
}

// ============ Error boundary (shows the real error instead of a blank page) ============
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Availability tool crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", background: "#14181F", color: "#F7F4EE", fontFamily: "sans-serif", padding: 30 }}>
          <h2 style={{ marginTop: 0 }}>Something went wrong</h2>
          <p style={{ color: "#8B93A3" }}>The page hit an unexpected error and stopped rendering. The details below will help fix it:</p>
          <pre style={{ background: "rgba(255,255,255,0.06)", padding: 16, borderRadius: 8, whiteSpace: "pre-wrap", fontSize: 13 }}>
            {String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
          </pre>
          <button
            onClick={() => this.setState({ error: null })}
            style={{ marginTop: 16, background: "#E8A33D", color: "#14181F", border: "none", borderRadius: 8, padding: "10px 18px", fontWeight: 700, cursor: "pointer" }}
          >
            Try again
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ============ App ============
function App() {
  const [lang, setLang] = useState(() => (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en");
  const t = STRINGS[lang];
  const locale = lang === "fr" ? "fr-FR" : "en-US";
  const hour12 = lang !== "fr";

  const [screen, setScreen] = useState("loading"); // loading | needs-setup | connection-error | picker | create | respond | gate | edit
  const [surveys, setSurveys] = useState([]);
  const [surveysLoading, setSurveysLoading] = useState(false);
  const [currentId, setCurrentId] = useState(null);
  const [currentConfig, setCurrentConfig] = useState(null);

  const refreshSurveys = useCallback(async () => {
    setSurveysLoading(true);
    try {
      setSurveys(await apiListSurveys());
    } catch {
      // keep whatever list we already have
    } finally {
      setSurveysLoading(false);
    }
  }, []);

  const initialLoad = useCallback(async () => {
    if (SCRIPT_NOT_CONFIGURED) { setScreen("needs-setup"); return; }
    setScreen("loading");
    try {
      const sharedId = getSharedPollIdFromHash();
      if (sharedId) {
        try {
          const cfg = await apiGetConfig(sharedId);
          if (cfg) {
            setCurrentId(sharedId);
            setCurrentConfig(cfg);
            setScreen("respond");
            return;
          }
        } catch {
          // fall through to the picker below
        }
      }
      const list = await apiListSurveys();
      setSurveys(list);
      setScreen("picker");
    } catch {
      setScreen("connection-error");
    }
  }, []);

  useEffect(() => { initialLoad(); }, [initialLoad]);

  async function openSurvey(id) {
    setScreen("loading");
    try {
      const cfg = await apiGetConfig(id);
      setCurrentId(id);
      setCurrentConfig(cfg);
      setScreen("respond");
    } catch {
      setScreen("connection-error");
    }
  }

  function handleCreated(id, config) {
    setCurrentId(id);
    setCurrentConfig(config);
    setScreen("respond");
    refreshSurveys();
  }

  function handleEdited(config) {
    setCurrentConfig(config);
    setScreen("respond");
    refreshSurveys();
  }

  function handleDeleted() {
    setCurrentId(null);
    setCurrentConfig(null);
    setScreen("picker");
    refreshSurveys();
  }

  return (
    <div style={styles.page}>
      <div style={styles.shell}>
        <div style={styles.topBar}>
          <div style={styles.eyebrow}>{screen !== "loading" ? t.eyebrow : ""}</div>
          <div style={styles.langToggle}>
            <button onClick={() => setLang("en")} style={{ ...styles.langBtn, ...(lang === "en" ? styles.langBtnActive : {}) }}>EN</button>
            <span style={styles.langDivider}>|</span>
            <button onClick={() => setLang("fr")} style={{ ...styles.langBtn, ...(lang === "fr" ? styles.langBtnActive : {}) }}>FR</button>
          </div>
        </div>

        {screen === "loading" && <div style={styles.loadingText}>{t.loading}</div>}

        {screen === "needs-setup" && (
          <div style={styles.gateBox}>
            <h1 style={styles.h1}>{t.needsSetupTitle}</h1>
            <p style={styles.sub}>{t.needsSetupBody}</p>
            <ol style={styles.stepsList}>
              {t.needsSetupSteps.map((s, i) => <li key={i} style={styles.stepsItem}>{s}</li>)}
            </ol>
          </div>
        )}

        {screen === "connection-error" && (
          <div style={styles.gateBox}>
            <h1 style={styles.h1}>{t.connectionErrorTitle}</h1>
            <p style={styles.sub}>{t.connectionErrorBody}</p>
            <button onClick={initialLoad} style={styles.submitBtn}>{t.retryBtn}</button>
          </div>
        )}

        {screen === "picker" && (
          <PickerScreen
            t={t} locale={locale}
            surveys={surveys} loading={surveysLoading}
            onOpen={openSurvey}
            onCreateNew={() => setScreen("create")}
          />
        )}

        {screen === "create" && (
          <SetupForm
            key="create"
            t={t} lang={lang}
            surveyId={null}
            existingConfig={null}
            onSaved={handleCreated}
            onCancel={() => setScreen("picker")}
            onDeleted={handleDeleted}
          />
        )}

        {screen === "edit" && currentConfig && (
          <SetupForm
            key={currentId}
            t={t} lang={lang}
            surveyId={currentId}
            existingConfig={currentConfig}
            onSaved={handleEdited}
            onCancel={() => setScreen("respond")}
            onDeleted={handleDeleted}
          />
        )}

        {screen === "gate" && currentConfig && (
          <PassGate
            t={t}
            config={currentConfig}
            onUnlock={() => setScreen("edit")}
            onCancel={() => setScreen("respond")}
          />
        )}

        {screen === "respond" && currentConfig && (
          <RespondentApp
            t={t} lang={lang} locale={locale} hour12={hour12}
            surveyId={currentId}
            config={currentConfig}
            onOrganizerClick={() => setScreen(currentConfig.passphrase ? "gate" : "edit")}
            onBackToPolls={() => { setScreen("picker"); refreshSurveys(); }}
          />
        )}
      </div>
    </div>
  );
}

// ============ Picker ============

// ============ Setup / Edit form ============
function SetupForm({ t, lang, surveyId, existingConfig, onSaved, onCancel, onDeleted }) {
  const isEdit = !!existingConfig;
  const detected = useMemo(() => detectTZ(), []);
  const [title, setTitle] = useState(existingConfig?.title || "");
  const [description, setDescription] = useState(existingConfig?.description || "");
  const [dates, setDates] = useState(Array.isArray(existingConfig?.dates) ? existingConfig.dates : []);
  const [dateInput, setDateInput] = useState(todayStr());
  const [startMinutes, setStartMinutes] = useState(existingConfig?.startMinutes ?? 9 * 60);
  const [endMinutes, setEndMinutes] = useState(existingConfig?.endMinutes ?? 17 * 60);
  const [tz, setTz] = useState(existingConfig?.tz || detected);
  const [passphrase, setPassphrase] = useState(existingConfig?.passphrase || "");
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [clearing, setClearing] = useState(false);
  const [clearMsg, setClearMsg] = useState(null);
  const [deleting, setDeleting] = useState(false);

  const opts = useMemo(() => timeOptions(lang), [lang]);

  function addDate() {
    if (!dateInput) return;
    setDates((prev) => Array.from(new Set([...(Array.isArray(prev) ? prev : []), dateInput])).sort());
  }
  function removeDate(d) {
    setDates((prev) => (Array.isArray(prev) ? prev : []).filter((x) => x !== d));
  }

  async function handleSubmit() {
    setError(null);
    if (!title.trim()) { setError(t.needTitle); return; }
    if (dates.length === 0) { setError(t.needAtLeastOneDate); return; }
    if (endMinutes <= startMinutes) { setError(t.needValidWindow); return; }
    const idToUse = surveyId || generateSurveyId(title);
    const newConfig = {
      title: title.trim(),
      description: description.trim(),
      dates: [...dates].sort(),
      startMinutes, endMinutes, tz,
      passphrase: passphrase.trim(),
      createdAt: existingConfig?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    setSaving(true);
    try {
      const result = await apiSaveConfig(idToUse, newConfig);
      if (result.ok) {
        onSaved(idToUse, result.config);
      } else {
        setError(t.configSaveFailed);
      }
    } catch (e) {
      setError(t.saveError);
    } finally {
      setSaving(false);
    }
  }

  async function handleClearResponses() {
    if (!window.confirm(t.clearResponsesConfirm)) return;
    setClearing(true);
    try {
      const result = await apiClearResponses(surveyId, passphrase);
      setClearMsg(result.ok);
      if (!result.ok) setError(t.wrongPass);
    } catch (e) {
      setError(t.saveError);
    } finally {
      setClearing(false);
    }
  }

  async function handleDeleteSurvey() {
    if (!window.confirm(t.deleteSurveyConfirm)) return;
    setDeleting(true);
    setError(null);
    try {
      const result = await apiDeleteSurvey(surveyId, passphrase);
      if (result.ok) {
        onDeleted();
      } else {
        setError(t.deleteSurveyFailed);
      }
    } catch (e) {
      setError(t.saveError);
    } finally {
      setDeleting(false);
    }
  }

  return (
    <div>
      <h1 style={styles.h1}>{isEdit ? t.setupHeadingEdit : t.setupHeadingNew}</h1>
      <p style={styles.sub}>{t.setupSub}</p>

      <div style={styles.field}>
        <label style={styles.label}>{t.titleLabel}</label>
        <input style={styles.input} value={title} onChange={(e) => setTitle(e.target.value)} placeholder={t.titlePlaceholder} />
      </div>

      <div style={styles.field}>
        <label style={styles.label}>{t.descLabel}</label>
        <textarea style={{ ...styles.input, minHeight: 70, resize: "vertical" }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder={t.descPlaceholder} />
      </div>

      <div style={styles.field}>
        <label style={styles.label}>{t.datesLabel}</label>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input type="date" style={{ ...styles.input, maxWidth: 200 }} value={dateInput} onChange={(e) => setDateInput(e.target.value)} />
          <button type="button" onClick={addDate} style={styles.smallBtn}>{t.addDate}</button>
        </div>
        <div style={styles.chipsWrap}>
          {dates.length === 0 && <span style={styles.mutedText}>{t.noDatesYet}</span>}
          {dates.map((d) => (
            <span key={d} style={styles.chip}>
              {d}
              <button type="button" onClick={() => removeDate(d)} style={styles.chipX} aria-label={t.remove}>&times;</button>
            </span>
          ))}
        </div>
      </div>

      <div style={styles.field}>
        <label style={styles.label}>{t.windowLabel}</label>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span style={styles.miniLabel}>{t.fromLabel}</span>
            <select style={styles.input} value={startMinutes} onChange={(e) => setStartMinutes(Number(e.target.value))}>
              {opts.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span style={styles.miniLabel}>{t.toLabel}</span>
            <select style={styles.input} value={endMinutes} onChange={(e) => setEndMinutes(Number(e.target.value))}>
              {opts.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
        </div>
      </div>

      <div style={styles.field}>
        <label style={styles.label}>{t.yourTzLabel} {tz === detected && <span style={styles.detectedTag}>{t.autoDetected}</span>}</label>
        <select style={styles.input} value={tz} onChange={(e) => setTz(e.target.value)}>
          {!COMMON_ZONES.includes(detected) && <option value={detected}>{tzLabel(detected)}</option>}
          {COMMON_ZONES.map((z) => <option key={z} value={z}>{tzLabel(z)}</option>)}
        </select>
      </div>

      <div style={styles.field}>
        <label style={styles.label}>{t.passLabel}</label>
        <input style={styles.input} type="text" value={passphrase} onChange={(e) => setPassphrase(e.target.value)} placeholder={t.passPlaceholder} />
        <span style={styles.mutedText}>{t.passHint}</span>
      </div>

      {error && <div style={styles.errorText}>{error}</div>}

      <div style={{ display: "flex", gap: 10, marginTop: 18, flexWrap: "wrap" }}>
        <button onClick={handleSubmit} disabled={saving} style={styles.submitBtn}>{isEdit ? t.saveBtn : t.publishBtn}</button>
        {onCancel && <button onClick={onCancel} style={styles.smallBtn}>{t.cancelEditBtn}</button>}
      </div>

      {isEdit && (
        <div style={styles.dangerZone}>
          <button onClick={handleClearResponses} disabled={clearing} style={styles.dangerBtn}>{t.clearResponsesBtn}</button>
          {clearMsg && <span style={styles.mutedText}>&#10003;</span>}
          <button onClick={handleDeleteSurvey} disabled={deleting} style={styles.dangerBtn}>{t.deleteSurveyBtn}</button>
        </div>
      )}
    </div>
  );
}

// ============ Passphrase gate ============
function PassGate({ t, config, onUnlock, onCancel }) {
  const [val, setVal] = useState("");
  const [err, setErr] = useState(false);
  function submit() {
    if (val === config.passphrase) onUnlock();
    else setErr(true);
  }
  return (
    <div style={styles.gateBox}>
      <p style={styles.sub}>{t.passPrompt}</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input
          style={styles.input} type="password" value={val}
          onChange={(e) => { setVal(e.target.value); setErr(false); }}
          placeholder={t.passPlaceholderGate}
          onKeyDown={(e) => e.key === "Enter" && submit()}
        />
        <button onClick={submit} style={styles.submitBtn}>{t.unlockBtn}</button>
        <button onClick={onCancel} style={styles.smallBtn}>{t.cancelBtn}</button>
      </div>
      {err && <div style={styles.errorText}>{t.wrongPass}</div>}
    </div>
  );
}

// ============ Respondent app (pick + results) ============
function RespondentApp({ t, lang, locale, hour12, surveyId, config, onOrganizerClick, onBackToPolls }) {
  const detected = useMemo(() => detectTZ(), []);
  const [name, setName] = useState("");
  const [tz, setTz] = useState(detected);
  const [tzOverridden, setTzOverridden] = useState(false);
  const [selected, setSelected] = useState(() => new Set());
  const [dragging, setDragging] = useState(false);
  const [dragMode, setDragMode] = useState(true);
  const [submitted, setSubmitted] = useState(false);
  const [saveError, setSaveError] = useState(null);
  const [view, setView] = useState("pick");
  const [allResponses, setAllResponses] = useState([]);
  const [loadingResults, setLoadingResults] = useState(false);
  const [copyState, setCopyState] = useState("idle");
  const [shareState, setShareState] = useState("idle");

  async function handleShare() {
    const link = buildShareLink(surveyId);
    try {
      if (link) {
        await navigator.clipboard.writeText(link);
        setShareState("copied");
      } else {
        await navigator.clipboard.writeText(t.shareFallback.replace("{title}", config.title));
        setShareState("fallback");
      }
    } catch {
      setShareState("idle");
    }
    setTimeout(() => setShareState("idle"), 2200);
  }

  useEffect(() => {
    const onUp = () => setDragging(false);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("touchend", onUp);
    return () => {
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchend", onUp);
    };
  }, []);

  const rawSlots = Math.round((config.endMinutes - config.startMinutes) / SLOT_MIN);
  const numSlots = Number.isFinite(rawSlots) && rawSlots > 0 ? rawSlots : 1;
  const validDates = Array.isArray(config.dates) ? config.dates : [];

  const toggleSlot = useCallback((key, forceMode) => {
    setSelected((prev) => {
      const next = new Set(prev);
      const mode = forceMode !== undefined ? forceMode : !next.has(key);
      if (mode) next.add(key); else next.delete(key);
      return next;
    });
  }, []);
  const handleMouseDown = (key) => {
    const willAdd = !selected.has(key);
    setDragMode(willAdd); setDragging(true); toggleSlot(key, willAdd);
  };
  const handleMouseEnter = (key) => { if (dragging) toggleSlot(key, dragMode); };

  const grid = useMemo(() => {
    return validDates.map((dateStr) => {
      const rows = [];
      for (let s = 0; s < numSlots; s++) {
        rows.push({ date: slotToDate(dateStr, s, config.tz, config.startMinutes) });
      }
      return rows;
    });
  }, [config, numSlots]);

  const rowLabels = useMemo(() => {
    if (grid.length === 0) return [];
    return grid[0].map((cell) => timeLabel(cell.date, tz, locale, hour12));
  }, [grid, tz, locale, hour12]);
  const colLabels = useMemo(() => grid.map((col) => (col.length ? colHeaderLabel(col[0].date, tz, locale) : "")), [grid, tz, locale]);

  async function loadResults() {
    setLoadingResults(true);
    try {
      const items = await apiListResponses(surveyId);
      items.sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1));
      setAllResponses(items);
    } catch {
      // keep whatever is already shown
    } finally {
      setLoadingResults(false);
    }
  }
  useEffect(() => { if (view === "results") loadResults(); }, [view]);

  async function handleSubmit() {
    if (selected.size === 0) return;
    setSaveError(null);
    const id = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const record = {
      id,
      name: name.trim() || "Anonymous",
      tz,
      submittedAt: new Date().toISOString(),
      slots: Array.from(selected).map((key) => {
        const [dIdx, sIdx] = key.split("-").map(Number);
        return slotToDate(validDates[dIdx], sIdx, config.tz, config.startMinutes).toISOString();
      }),
    };
    try {
      const result = await apiSaveResponse(surveyId, record);
      if (result.ok) {
        setSubmitted(true);
        setAllResponses(result.responses);
      } else {
        setSaveError(t.responseSaveFailed);
      }
    } catch (e) {
      setSaveError(t.saveError);
    }
  }

  function exportCSV() {
    const lines = ["name,timezone,submitted_at,slot_utc_iso"];
    allResponses.forEach((r) => {
      r.slots.forEach((s) => lines.push(`"${r.name.replace(/"/g, '""')}","${r.tz}","${r.submittedAt}","${s}"`));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "availability_responses.csv"; a.click();
    URL.revokeObjectURL(url);
  }

  async function copySummary() {
    const counts = {};
    allResponses.forEach((r) => r.slots.forEach((iso) => { counts[iso] = (counts[iso] || 0) + 1; }));
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const lines = [`${config.title} — ${t.bestTimes} (${tz})`, ""];
    sorted.slice(0, 20).forEach(([iso, count]) => {
      lines.push(`${fullLabel(new Date(iso), tz, locale, hour12)} — ${count}/${allResponses.length}`);
    });
    try {
      await navigator.clipboard.writeText(lines.join("\n"));
      setCopyState("copied");
      setTimeout(() => setCopyState("idle"), 1500);
    } catch { setCopyState("idle"); }
  }

  const selectedCount = selected.size;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <button onClick={onBackToPolls} style={styles.backLink}>{t.backToPolls}</button>
        <button onClick={handleShare} style={styles.smallBtn}>
          {shareState === "copied" ? t.linkCopied : shareState === "fallback" ? t.shareFallbackCopied : t.shareBtn}
        </button>
      </div>
      <h1 style={styles.h1}>{config.title}</h1>
      {config.description && <p style={styles.sub}>{config.description}</p>}
      <p style={{ ...styles.sub, marginTop: 6 }}>{t.respSub}</p>

      <div style={styles.tabs}>
        <button onClick={() => setView("pick")} style={{ ...styles.tabBtn, ...(view === "pick" ? styles.tabBtnActive : {}) }}>{t.tabPick}</button>
        <button onClick={() => setView("results")} style={{ ...styles.tabBtn, ...(view === "results" ? styles.tabBtnActive : {}) }}>{t.tabResults}</button>
      </div>

      {view === "pick" && (
        <React.Fragment>
          <div style={styles.controlsRow}>
            <div style={styles.field}>
              <label style={styles.label}>{t.nameLabel}</label>
              <input value={name} onChange={(e) => setName(e.target.value)} placeholder={t.namePlaceholder} style={styles.input} />
            </div>
            <div style={styles.field}>
              <label style={styles.label}>{t.yourTzLabel} {!tzOverridden && <span style={styles.detectedTag}>{t.autoDetected}</span>}</label>
              <select
                value={tz}
                onChange={(e) => { setTz(e.target.value); setTzOverridden(e.target.value !== detected); }}
                style={styles.input}
              >
                {!COMMON_ZONES.includes(detected) && <option value={detected}>{tzLabel(detected)}</option>}
                {COMMON_ZONES.map((z) => <option key={z} value={z}>{tzLabel(z)}</option>)}
              </select>
            </div>
          </div>

          <div style={styles.gridWrap}>
            <div style={{ ...styles.gridInner, gridTemplateColumns: `76px repeat(${validDates.length}, 1fr)` }} onMouseLeave={() => setDragging(false)}>
              <div style={styles.cornerCell} />
              {colLabels.map((c, i) => <div key={i} style={styles.dayHeader}>{c}</div>)}
              {rowLabels.map((rl, rowIdx) => (
                <React.Fragment key={rowIdx}>
                  <div style={styles.timeLabelCell}>{rowIdx % 2 === 0 ? rl : ""}</div>
                  {validDates.map((_, dateIdx) => {
                    const key = slotKey(dateIdx, rowIdx);
                    const isOn = selected.has(key);
                    return (
                      <div
                        key={key}
                        onMouseDown={() => handleMouseDown(key)}
                        onMouseEnter={() => handleMouseEnter(key)}
                        onTouchStart={() => handleMouseDown(key)}
                        style={{ ...styles.cell, ...(isOn ? styles.cellOn : {}), borderTopStyle: rowIdx % 2 === 0 ? "solid" : "dashed" }}
                      />
                    );
                  })}
                </React.Fragment>
              ))}
            </div>
          </div>

          <div style={styles.footerRow}>
            <div style={styles.countTag}>
              {selectedCount === 0 ? t.noSlotsYet : `${selectedCount} · ${(selectedCount / 2).toFixed(1)}h`}
            </div>
            <button onClick={handleSubmit} disabled={selectedCount === 0} style={{ ...styles.submitBtn, ...(selectedCount === 0 ? styles.submitBtnDisabled : {}) }}>
              {t.submitBtn}
            </button>
          </div>
          {saveError && <div style={styles.errorText}>{saveError}</div>}
          {submitted && <div style={styles.successBanner}>{t.savedBanner}</div>}
        </React.Fragment>
      )}

      {view === "results" && (
        <ResultsView
          t={t} locale={locale} hour12={hour12}
          responses={allResponses} loading={loadingResults} viewerTz={tz}
          onExport={exportCSV} onCopy={copySummary} copyState={copyState} onRefresh={loadResults}
        />
      )}

      <div style={styles.organizerFooter}>
        <button onClick={onOrganizerClick} style={styles.organizerLinkBtn}>{t.organizerLink}</button>
      </div>
    </div>
  );
}

function ResultsView({ t, locale, hour12, responses, loading, viewerTz, onExport, onCopy, copyState, onRefresh }) {
  const overlapMap = useMemo(() => {
    const counts = {};
    responses.forEach((r) => {
      r.slots.forEach((iso) => {
        counts[iso] = counts[iso] || { count: 0 };
        counts[iso].count += 1;
      });
    });
    return counts;
  }, [responses]);
  const bestSlots = useMemo(() => Object.entries(overlapMap).sort((a, b) => b[1].count - a[1].count).slice(0, 8), [overlapMap]);
  const maxCount = responses.length || 1;

  return (
    <div>
      <div style={styles.resultsBar}>
        <div style={styles.label}>{loading ? t.loading : `${responses.length} · ${tzShort(viewerTz)}`}</div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onRefresh} style={styles.smallBtn}>{t.refresh}</button>
          <button onClick={onCopy} style={styles.smallBtn}>{copyState === "copied" ? t.copied : t.copySummary}</button>
          <button onClick={onExport} style={styles.smallBtn}>{t.exportCsv}</button>
        </div>
      </div>

      {responses.length === 0 && !loading && <div style={styles.emptyState}>{t.noResponsesYet}</div>}

      {bestSlots.length > 0 && (
        <div style={styles.bestWrap}>
          <div style={styles.bestTitle}>{t.bestTimes}</div>
          {bestSlots.map(([iso, data]) => {
            const label = fullLabel(new Date(iso), viewerTz, locale, hour12);
            const pct = Math.round((data.count / maxCount) * 100);
            return (
              <div key={iso} style={styles.bestRow}>
                <div style={styles.bestTime}>{label}</div>
                <div style={styles.barTrack}><div style={{ ...styles.barFill, width: `${pct}%` }} /></div>
                <div style={styles.bestCount}>{data.count}/{maxCount}</div>
              </div>
            );
          })}
        </div>
      )}

      {responses.length > 0 && (
        <div style={styles.respList}>
          <div style={styles.bestTitle}>{t.allResponses}</div>
          {responses.map((r) => (
            <div key={r.id} style={styles.respRow}>
              <div style={styles.respName}>{r.name}</div>
              <div style={styles.respMeta}>{tzShort(r.tz)} · {r.slots.length}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
